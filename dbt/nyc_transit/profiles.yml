# Four targets, one model tree. No model changes between them.
#
# `duckdb` is the default and the local and CI target. It reads the committed
# seeds so `dbt build` runs on a laptop with no cluster, no Kafka and no AWS.
#
# `athena` is the production target. Same models, same Glue catalog, serverless,
# no JVM, and it supports views so `dbt snapshot` runs. An Iceberg catalog on
# Spark cannot replace a view, which is what a snapshot does on every run after
# the first, so the snapshot only works here. See docs/data_model.md.
#
# `spark` and `spark_session` are kept for a cluster that already exists.
# `spark` goes through a Thrift Server, `spark_session` builds its own
# in process SparkSession and needs nothing listening. Both run the models and
# the tests, neither runs the snapshot.
#
# A real deployment reads host and credentials from the environment, see
# docker/.env.example and infra/modules/iam. No secrets live in this file.
nyc_transit:
  target: duckdb
  outputs:
    duckdb:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', 'target/nyc_transit.duckdb') }}"
      threads: 4
      schema: main
      extensions:
        - parquet

    athena:
      type: athena
      # The workgroup pins the results location and the per query scan ceiling,
      # so nothing here can point queries somewhere unbudgeted.
      work_group: "{{ env_var('DBT_ATHENA_WORKGROUP', 'nyc-transit-lakehouse-dev') }}"
      s3_staging_dir: "{{ env_var('DBT_ATHENA_S3_STAGING_DIR', 's3://change-me/athena-results/') }}"
      region_name: "{{ env_var('AWS_REGION', 'us-east-1') }}"
      database: awsdatacatalog
      schema: "{{ env_var('DBT_ATHENA_SCHEMA', 'marts') }}"
      threads: 4
      # Iceberg for everything, which is what the streaming layer writes.
      table_type: iceberg

    spark:
      type: spark
      method: thrift
      host: "{{ env_var('DBT_SPARK_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_SPARK_PORT', '10000') | int }}"
      user: "{{ env_var('DBT_SPARK_USER', 'dbt') }}"
      schema: "{{ env_var('DBT_SPARK_SCHEMA', 'marts') }}"
      threads: 4
      connect_retries: 3
      connect_timeout: 30
      server_side_parameters:
        spark.sql.catalog.lakehouse: org.apache.iceberg.spark.SparkCatalog

    # One node, no Thrift Server. The catalog is configured through
    # server_side_parameters because dbt owns the session here, so there is no
    # spark-submit to pass --conf to.
    spark_session:
      type: spark
      method: session
      host: NA
      schema: "{{ env_var('DBT_SPARK_SCHEMA', 'marts') }}"
      threads: 1
      server_side_parameters:
        spark.sql.catalog.lakehouse: org.apache.iceberg.spark.SparkCatalog
        spark.sql.catalog.lakehouse.catalog-impl: org.apache.iceberg.aws.glue.GlueCatalog
        spark.sql.catalog.lakehouse.io-impl: org.apache.iceberg.aws.s3.S3FileIO
        spark.sql.catalog.lakehouse.warehouse: "{{ env_var('LAKEHOUSE_WAREHOUSE', 's3://change-me/warehouse') }}"
        spark.sql.extensions: org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
        spark.sql.defaultCatalog: lakehouse
        spark.jars.packages: "{{ env_var('DBT_SPARK_PACKAGES', '') }}"
