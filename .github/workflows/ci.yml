name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Cancel superseded runs on the same ref, but never on main: a cancelled main
  # run leaves the branch with no verdict at all.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install linters
        # Only the linters, not the whole dev set: lint feedback should arrive
        # in under a minute, and pyspark alone is a 300 MB download.
        run: pip install "ruff>=0.5" "black>=24.4"

      - name: ruff check
        run: ruff check src tests scripts airflow

      - name: black --check
        run: black --check --diff src tests scripts airflow

  test:
    name: Unit + integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Set up JDK 17
        # pyspark needs a JVM. 17 is the newest LTS Spark 3.5 supports.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements/dev.txt
          python -m pip install -e . --no-deps
      - name: Compile the vendored protobuf sources
        # The nyct extension is not in the gtfs-realtime-bindings wheel, so the
        # generated modules are built here rather than committed. Without this
        # nothing that imports nyc_transit.gtfs resolves.
        run: |
          python -m pip install "grpcio-tools>=1.60"
          python -m grpc_tools.protoc -I proto --python_out=src \
            proto/nyc_transit/gtfs/proto/gtfs-realtime.proto \
            proto/nyc_transit/gtfs/proto/nyct-subway.proto

      - name: Cache Ivy/Maven jars
        # The Iceberg + Kafka + spark-avro jars are ~120 MB and are fetched by
        # spark.jars.packages on the first SparkSession. Without this cache the
        # Spark-marked tests spend longer downloading than running.
        uses: actions/cache@v4
        with:
          path: |
            ~/.ivy2
            ~/.m2/repository
          key: ivy-${{ runner.os }}-${{ hashFiles('requirements/spark.txt', 'src/nyc_transit/config.py') }}
          restore-keys: ivy-${{ runner.os }}-

      - name: Run tests
        env:
          # Keep Spark's local-mode footprint inside a 2-core runner.
          SPARK_LOCAL_IP: 127.0.0.1
          PYSPARK_PYTHON: python
          PYSPARK_DRIVER_PYTHON: python
        run: |
          pytest -v --cov=nyc_transit --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  seeds-are-reproducible:
    name: dbt seeds match their generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements/base.txt
          python -m pip install -e . --no-deps
      - name: Compile the vendored protobuf sources
        # The nyct extension is not in the gtfs-realtime-bindings wheel, so the
        # generated modules are built here rather than committed. Without this
        # nothing that imports nyc_transit.gtfs resolves.
        run: |
          python -m pip install "grpcio-tools>=1.60"
          python -m grpc_tools.protoc -I proto --python_out=src \
            proto/nyc_transit/gtfs/proto/gtfs-realtime.proto \
            proto/nyc_transit/gtfs/proto/nyct-subway.proto

      - name: Regenerate seeds
        run: python scripts/generate_dbt_seeds.py

      - name: Fail if the committed seeds drifted
        # The seeds are generated from the fixture by a deterministic script.
        # If this fails, either the generator changed and the seeds were not
        # regenerated, or the generator stopped being deterministic. Both are
        # bugs: the dbt test suite's credibility rests on the seeds being
        # exactly what the generator produces.
        run: git diff --exit-code -- dbt/nyc_transit/seeds

  dbt:
    name: dbt build (duckdb)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dbt
        run: python -m pip install -r requirements/dbt.txt

      - name: dbt deps
        working-directory: dbt/nyc_transit
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt/nyc_transit
        run: dbt deps

      - name: dbt parse
        working-directory: dbt/nyc_transit
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt/nyc_transit
        run: dbt parse

      - name: dbt compile
        working-directory: dbt/nyc_transit
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt/nyc_transit
        run: dbt compile

      - name: dbt seed
        # Separate from build: the seed-backed sources must exist before dbt
        # runs the source-level tests, and `dbt build` does not order
        # source tests after seeds.
        working-directory: dbt/nyc_transit
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt/nyc_transit
        run: dbt seed

      - name: dbt build (models, snapshots, all tests)
        working-directory: dbt/nyc_transit
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt/nyc_transit
        run: dbt build

      - name: Re-run one partition twice (incremental idempotency)
        # The claim is that a backfill is safely re-runnable, so CI asserts it.
        working-directory: dbt/nyc_transit
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt/nyc_transit
        run: |
          dbt run --select fct_trip_stop_prediction fct_stop_arrival_estimate dim_vehicle_assignment \
            --vars '{"run_date": "2026-11-01"}'
          dbt run --select fct_trip_stop_prediction fct_stop_arrival_estimate dim_vehicle_assignment \
            --vars '{"run_date": "2026-11-01"}'
          dbt test

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-target
          path: |
            dbt/nyc_transit/target/manifest.json
            dbt/nyc_transit/target/run_results.json
          if-no-files-found: warn

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate every compose profile
        # config fully interpolates and type checks the file
        # it starts nothing so this is a syntax and wiring check
        run: |
          docker compose -f docker/docker-compose.yml config -q
          for profile in airflow bench live tools; do
            echo "::group::profile $profile"
            docker compose -f docker/docker-compose.yml --profile "$profile" config -q
            echo "::endgroup::"
          done

  airflow-dags:
    name: Airflow DAGs import
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install Airflow with its constraints
        run: |
          AIRFLOW_VERSION=2.10.5
          python -m pip install -r requirements/airflow.txt \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${{ env.PYTHON_VERSION }}.txt"
          python -m pip install -r requirements/base.txt
          python -m pip install -e . --no-deps
      - name: Compile the vendored protobuf sources
        # The nyct extension is not in the gtfs-realtime-bindings wheel, so the
        # generated modules are built here rather than committed. Without this
        # nothing that imports nyc_transit.gtfs resolves.
        run: |
          python -m pip install "grpcio-tools>=1.60"
          python -m grpc_tools.protoc -I proto --python_out=src \
            proto/nyc_transit/gtfs/proto/gtfs-realtime.proto \
            proto/nyc_transit/gtfs/proto/nyct-subway.proto

      - name: Import every DAG and assert the expected dag_ids
        # `DagBag` import is the real check: a DAG that raises at parse time is
        # invisible in the Airflow UI rather than failing loudly, so this is
        # the cheapest guard against a broken deploy.
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
          AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/airflow/dags
          PYTHONPATH: ${{ github.workspace }}/airflow/plugins:${{ github.workspace }}/src
        run: python scripts/check_dags.py
